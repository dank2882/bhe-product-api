<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171918">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Sermon Walk</title>
  <link rel="manifest" href="/sermon-walk/manifest.webmanifest">
  <link rel="stylesheet" href="/sermon-walk/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="product-name">Sermon Walk</p>
      <h1 id="sermonTitle">Opening session</h1>
      <p id="sermonText" class="sermon-text"></p>
    </div>
    <span id="connectionBadge" class="status-badge" data-state="idle">Idle</span>
  </header>

  <main>
    <section class="capture-band" aria-labelledby="captureHeading">
      <div class="capture-copy">
        <p id="captureHeading" class="section-label">Live capture</p>
        <p id="elapsed" class="elapsed" aria-live="polite">00:00</p>
      </div>
      <canvas id="waveform" width="900" height="210" aria-label="Live microphone level"></canvas>
      <div class="primary-actions">
        <button id="startButton" class="record-button" type="button">
          <span class="record-icon" aria-hidden="true"></span>
          <span>Start walk</span>
        </button>
        <button id="finishButton" class="finish-button" type="button" disabled>
          <span class="stop-icon" aria-hidden="true"></span>
          <span>Finish and verify</span>
        </button>
      </div>
      <p id="primaryStatus" class="primary-status" aria-live="assertive">Preparing the session...</p>
    </section>

    <section class="receipt-band" aria-labelledby="receiptHeading">
      <div class="band-heading">
        <div>
          <p class="section-label">Capture receipt</p>
          <h2 id="receiptHeading">Nothing recorded yet</h2>
        </div>
        <button id="retryButton" class="icon-button" type="button" title="Retry pending saves" aria-label="Retry pending saves" disabled>
          <span aria-hidden="true">&#8635;</span>
        </button>
      </div>
      <dl class="metrics">
        <div><dt>Dan turns</dt><dd id="danTurns">0</dd></div>
        <div><dt>Audio saved</dt><dd id="audioSaved">0</dd></div>
        <div><dt>Pending</dt><dd id="pendingSaves">0</dd></div>
        <div><dt>Gaps</dt><dd id="captureGaps">0</dd></div>
      </dl>
    </section>

    <section class="transcript-band" aria-labelledby="transcriptHeading">
      <div class="band-heading">
        <div>
          <p class="section-label">Conversation</p>
          <h2 id="transcriptHeading">Live transcript</h2>
        </div>
      </div>
      <ol id="transcriptList" class="transcript-list">
        <li class="empty-state">Your captured turns will appear here.</li>
      </ol>
    </section>
  </main>

  <audio id="remoteAudio" autoplay></audio>
  <script src="/sermon-walk/app.js" defer></script>
</body>
</html>
